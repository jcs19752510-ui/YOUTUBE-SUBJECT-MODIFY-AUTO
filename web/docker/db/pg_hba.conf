# 컴포즈 내부 네트워크(사설 대역)에서 온 앱 계정만 허용한다. 위에서 아래로 첫 일치 규칙을 쓰며 모든 인증은 scram-sha-256 이다.
# 이 DB 컨테이너는 internal 네트워크에만 붙어 있고 호스트 포트도 없다. 아래 사설 대역 제한은 2중 방어다.
# 슈퍼유저(postgres)는 컨테이너 안(소켓·루프백)에서만 접속할 수 있다.
# TYPE  DATABASE  USER                        ADDRESS         METHOD
local   all       postgres                                    scram-sha-256
local   ytweb     ytweb_app,ytweb_owner                       scram-sha-256
host    all       postgres                    127.0.0.1/32    scram-sha-256
host    all       postgres                    ::1/128         scram-sha-256
host    ytweb     ytweb_app,ytweb_owner       127.0.0.1/32    scram-sha-256
host    ytweb     ytweb_app,ytweb_owner       10.0.0.0/8      scram-sha-256
host    ytweb     ytweb_app,ytweb_owner       172.16.0.0/12   scram-sha-256
host    ytweb     ytweb_app,ytweb_owner       192.168.0.0/16  scram-sha-256
host    all       all                         all             reject
