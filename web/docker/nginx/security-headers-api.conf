# /api 응답(JSON)용 보안 헤더. security-headers.conf 와 CSP 한 줄만 다르다: 페이지가 아니므로 아무것도 불러오지 못하게 default-src 'none' (DEF-7-007).
# 나머지 6줄은 security-headers.conf 와 같아야 한다(시험 TC-WIX-007 이 대조한다). 백엔드의 같은 헤더는 proxy.conf 가 숨겨 브라우저에는 이 한 벌만 보인다.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
