# 비루트(uid 101) nginx. 쓰기 가능한 곳은 /tmp(tmpfs)뿐이다.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    absolute_redirect off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # 쿼리 문자열·쿠키는 기록하지 않는다.
    log_format json_log escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';
    access_log /dev/stdout json_log;

    # 요청 크기·시간 제한
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;

    # 속도 제한(Docker Desktop 에서는 모든 요청이 게이트웨이 IP 로 보일 수 있어 사실상 전역 제한이다)
    limit_req_zone $binary_remote_addr zone=ytweb_api:1m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ytweb_auth:1m rate=10r/m;
    limit_req_status 429;

    # Docker 내장 DNS. api 컨테이너가 재생성되어 IP 가 바뀌어도 따라가도록 변수로 프록시한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # DNS 리바인딩 방어: 허용된 Host 만 처리한다(FastAPI 쪽 허용 목록과 이중).
    map $http_host $ytweb_host_ok {
        default 0;
        "127.0.0.1:8080" 1;
        "localhost:8080" 1;
    }

    server {
        listen 8080 default_server;
        server_name _;

        if ($ytweb_host_ok = 0) {
            return 444;
        }

        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            include /etc/nginx/snippets/security-headers.conf;
            return 200 "ok\n";
        }

        location = /api/healthz {
            limit_req zone=ytweb_api burst=60 nodelay;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/healthz;
            include /etc/nginx/snippets/proxy.conf;
        }

        location = /api/readyz {
            limit_req zone=ytweb_api burst=60 nodelay;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/readyz;
            include /etc/nginx/snippets/proxy.conf;
        }

        # 세션 발급(PIN 입력)은 더 엄격하게 제한한다.
        location = /api/v1/auth/session {
            limit_req zone=ytweb_auth burst=10 nodelay;
            limit_except GET HEAD POST DELETE { deny all; }
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            include /etc/nginx/snippets/proxy.conf;
        }

        location /api/ {
            limit_req zone=ytweb_api burst=60 nodelay;
            limit_except GET HEAD POST PUT PATCH DELETE { deny all; }
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            include /etc/nginx/snippets/proxy.conf;
        }

        # 파일명에 해시가 붙은 빌드 산출물
        location /assets/ {
            limit_except GET HEAD { deny all; }
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            gzip on;
            gzip_types text/css application/javascript text/javascript image/svg+xml;
            try_files $uri =404;
        }

        location / {
            limit_except GET HEAD { deny all; }
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            gzip on;
            gzip_types text/css application/javascript text/javascript image/svg+xml text/html;
            try_files $uri /index.html;
        }
    }
}
