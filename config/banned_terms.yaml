# 금칙어 사전. 아래는 "유형"별 초기 목록이며 예시일 뿐 전부가 아닙니다. 채널 상황에 맞게 자유롭게 고치세요.
# - terms: 공백·기호·전각 표기를 무시하고 비교합니다(예: "완 치", "특-효"도 걸림). 글자 2개 이상.
# - patterns: 정규식(숫자·기호가 중요한 표현용). 사전을 고치면 검증 기록에 사전 버전/해시가 남습니다.
# - severity: block(차단) 또는 warn(경고). 건강·금융 주제는 경고도 차단으로 처리됩니다.
version: 1
types:
  fear:        # 공포 조장
    severity: block
    terms: [이거 안 하면 큰일, 큰일 납니다, 큰일납니다, 의사들이 숨기는, 의사가 숨기는, 병원에서 알려주지 않는, 모르면 죽, 죽을 수도, 평생 후회, 돌이킬 수 없, 지금 당장 확인 안 하면, 이것만은 절대]
    patterns: []
  medical:     # 의료 효능 단정
    severity: block
    terms: [완치, 특효, 기적의, 직빵, 만병통치, 씻은 듯이, 약 끊, 약을 끊, 암이 사라, 당뇨 끊, 혈압약 끊, 치료됩니다, 병이 낫]
    patterns: []
  finance:     # 금융 수익·원금 보장
    severity: block
    terms: [무조건 수익, 원금 보장, 원금보장, 수익 보장, 수익보장, 확정 수익, 손실 없는, 손해 없는, 대박 보장]
    patterns: ['100\s*%\s*수익', '수익률\s*\d+\s*%\s*보장']
  impersonation:   # 공공기관·뉴스 사칭 오인
    severity: block
    terms: [정부 발표, 정부발표, 속보, 긴급 속보, 긴급 공지, 긴급공지, 긴급 안내, 공식 발표]
    patterns: []
  superlative: # 근거 없는 최상급·100% 단정
    severity: block
    terms: [무조건, 백프로, 틀림없이, 확실히 낫, 완벽 해결, 세계 최고, 국내 유일, 역대급]
    patterns: ['100\s*%', '100\s*퍼센트', '백\s*퍼센트']
warning:
  exclamation_max: 1       # 느낌표 개수가 이보다 많으면 경고
  emoji_max: 2             # 이모지 개수가 이보다 많으면 경고
  symbol_run_min: 3        # !!! ??? ~~~ ★★★ 처럼 같은 종류 기호가 이만큼 이어지면 경고
  caps_ratio_max: 0.6      # 영문 대문자 비율(영문 4자 이상일 때)
  special_ratio_max: 0.3   # 글자·숫자가 아닌 기호 비율
# 제목이나 요약에 이런 말이 보이면 주제 표시와 상관없이 엄격 모드(경고도 차단)로 올립니다.
strict_keywords: [건강, 혈압, 당뇨, 콜레스테롤, 치매, 관절, 영양제, 복용, 처방, 증상, 치료, 질환, 주식, 투자, 펀드, 코인, 비트코인, 대출, 연금, 보험, 재테크, 적금, 금리, 수익, 환급]
